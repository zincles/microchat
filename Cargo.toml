[package]
name = "microchat"
version = "0.1.0"
edition = "2024"

# 预留 workspace：后续 server / store 若拆 crate，在 members 里加即可，不必重构。
[workspace]

[dependencies]
axum = "0.8.9"
# 渲染后端用 wgpu：glow 在本机（Wayland 与 X11 都试过）能起进程但一帧都不渲染，
# 实测不可用；accesskit 关闭保留（省掉 zbus/atspi 链，egui 对屏幕阅读器支持本就有限）。
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "links",
    "wayland",
    "x11",
    "wgpu",
] }
egui_graphs = "0.32.0"
jsonc-parser = { version = "0.33.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 与 epaint 内部的 skrifa 同版本，合成一份编译（此处仅用于字体文件校验）。
skrifa = "0.44.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
