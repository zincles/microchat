[package]
name = "microchat"
version = "0.1.0"
edition = "2024"
# AGPL-3.0-only：完整文本见 LICENSE（自 gnu.org 逐字取回）。
# 将来若想允许衍生作品用更新版本，可改为 "AGPL-3.0-or-later"。
license = "AGPL-3.0-only"

# 预留 workspace：后续 server / store 若拆 crate，在 members 里加即可，不必重构。
[workspace]

[dependencies]
axum = "0.8.9"
# 渲染后端用 wgpu：glow 在本机（Wayland 与 X11 都试过）能起进程但一帧都不渲染，
# 实测不可用；accesskit 关闭保留（省掉 zbus/atspi 链，egui 对屏幕阅读器支持本就有限）。
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "links",
    "wayland",
    "x11",
    "wgpu",
] }
egui_graphs = "0.32.0"
# SSE 解析用现成库（规矩：与上游通信只许用成熟 crate，不手搓 `data: ` 分帧）
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
petgraph = "0.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 与 epaint 内部的 skrifa 同版本，合成一份编译（此处仅用于字体文件校验）。
skrifa = "0.44.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
