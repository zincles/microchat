<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- microchat 全页 doodle（手搓，CC0）：聊天小东西的线条轮廓，currentColor 漆色，透明度由 CSS 层定。
       九件：纸飞机 / 气泡 / 猫耳耳机 / 手柄 / 骰子 / 咖啡杯 / 月亮 / 星星 / 音符。 -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 纸飞机 -->
    <g transform="translate(40,36)">
      <path d="M4 26 L44 2 L18 44 L14 30 Z"/>
      <path d="M14 30 L44 2"/>
    </g>
    <!-- 气泡 -->
    <g transform="translate(250,30)">
      <rect x="4" y="8" width="48" height="32" rx="10"/>
      <path d="M16 40 L12 52 L26 40"/>
      <path d="M16 20 h24 M16 28 h16"/>
    </g>
    <!-- 猫耳耳机 -->
    <g transform="translate(120,120)">
      <path d="M8 10 L14 2 L22 12"/>
      <path d="M58 12 L66 2 L72 10"/>
      <path d="M10 22 a30 30 0 0 1 60 0"/>
      <rect x="4" y="22" width="14" height="26" rx="7"/>
      <rect x="62" y="22" width="14" height="26" rx="7"/>
    </g>
    <!-- 手柄 -->
    <g transform="translate(250,130)">
      <rect x="4" y="14" width="56" height="30" rx="15"/>
      <path d="M20 22 v12 M14 28 h12"/>
      <circle cx="44" cy="26" r="2.5"/>
      <circle cx="50" cy="32" r="2.5"/>
    </g>
    <!-- 骰子 -->
    <g transform="translate(30,230)">
      <rect x="6" y="6" width="44" height="44" rx="10"/>
      <circle cx="20" cy="20" r="2.5" fill="currentColor"/>
      <circle cx="42" cy="20" r="2.5" fill="currentColor"/>
      <circle cx="31" cy="31" r="2.5" fill="currentColor"/>
      <circle cx="20" cy="42" r="2.5" fill="currentColor"/>
      <circle cx="42" cy="42" r="2.5" fill="currentColor"/>
    </g>
    <!-- 咖啡杯 -->
    <g transform="translate(140,240)">
      <path d="M8 12 h40 v24 a12 12 0 0 1 -12 12 h-16 a12 12 0 0 1 -12 -12 Z"/>
      <path d="M48 16 h6 a8 8 0 0 1 0 16 h-7"/>
      <path d="M22 4 q3 4 0 8 M32 4 q3 4 0 8"/>
    </g>
    <!-- 月亮 -->
    <g transform="translate(260,250)">
      <path d="M44 8 a26 26 0 1 0 8 44 a20 20 0 1 1 -8 -44"/>
      <circle cx="18" cy="18" r="2" fill="currentColor"/>
    </g>
    <!-- 星星 -->
    <g transform="translate(90,290)">
      <path d="M20 4 L24 15 L36 15 L26 22 L30 34 L20 27 L10 34 L14 22 L4 15 L16 15 Z"/>
    </g>
    <!-- 音符 -->
    <g transform="translate(210,300)">
      <circle cx="10" cy="40" r="6"/>
      <circle cx="34" cy="36" r="6"/>
      <path d="M16 40 V12 L40 8 V36"/>
    </g>
  </g>
</svg>
