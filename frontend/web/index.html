<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- interactive-widget=resizes-content：Chromium 系键盘弹出时**缩布局视口**（vh 跟着变）；
       其余（iOS Safari / 不支持的）由 utils/viewport.js 的 visualViewport 拟合兜底。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>MicroChat</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- PWA：图标（iOS 用 apple-touch-icon；安卓走 manifest）+ 独立窗口 + 主题色 -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 主题色（手机状态栏 / PWA 标题栏）：兜底是**暗色主题的底色**，
       applyTheme 会按当前主题现改它（三套底色不同，写死一个值在亮色下就是一条黑边）。 -->
  <meta name="theme-color" content="#131313" />
  <link rel="stylesheet" href="./src/assets/theme.css" />
  <link rel="stylesheet" href="./src/assets/main.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
