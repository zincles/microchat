<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MicroChat</title>
  <link rel="stylesheet" href="./src/assets/theme.css" />
  <link rel="stylesheet" href="./src/assets/main.css" />
</head>
<body>
  <div id="app">
    <div id="topbar-vue"></div>
    <div id="columns">
      <div id="sessionbar-vue"></div>
      <div id="grip-left" class="grip" title="拖拽调左栏宽"></div>
      <section id="chat-col">
        <main id="messages-vue"></main>
        <div id="composer-vue"></div>
      </section>
      <div id="overlays-vue"></div>
      <div id="grip-right" class="grip" title="拖拽调右栏宽"></div>
      <div id="payloadbar-vue"></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="toast-vue"></div>
    <div id="settings" class="modal hidden">
      <div class="modal-box settings-box">
        <div class="modal-head">
          <span>设置</span>
          <span class="head-btns">
            <button id="settings-full" class="icon-btn" type="button" title="全屏切换">⛶</button>
            <button id="settings-close" class="icon-btn" type="button" title="关闭（不保存不写）">×</button>
          </span>
        </div>
        <div class="settings-cols">
          <nav class="settings-nav">
            <button id="tab-server" type="button" class="tab sel">服务端</button>
            <button id="tab-client" type="button" class="tab">客户端</button>
            <button id="tab-agent" type="button" class="tab">Agent</button>
            <button id="tab-provider" type="button" class="tab">Provider</button>
          </nav>
          <section id="panel-server" class="panel">
            <h3>chat</h3>
            <label class="field"><span>标题字数</span><input id="chat-title-chars" type="number" min="1" /></label>
            <label class="field"><span>模型上下文 tokens</span><input id="chat-model-ctx" type="number" min="1" /></label>
            <label class="field"><span>压缩块数</span><input id="chat-compact-blocks" type="number" min="1" /></label>
            <label class="field"><span>压缩触发 tokens（空=默认）</span><input id="chat-compact-trigger" type="number" min="1" placeholder="空=默认" /></label>
            <div class="row"><button id="chat-save" type="button" class="primary">保存 chat</button><span id="chat-status" class="status"></span></div>
            <h3>缺省三件</h3>
            <label class="field"><span>provider</span><input id="def-provider" placeholder="provider" /></label>
            <label class="field"><span>model</span><input id="def-model" placeholder="model" /></label>
            <label class="field"><span>agent</span><input id="def-agent" placeholder="agent" /></label>
            <div class="row"><button id="def-save" type="button" class="primary">保存缺省</button><span id="def-status" class="status"></span></div>
          </section>
          <section id="panel-client" class="panel hidden">
            <label class="field"><span>API 地址</span><input id="cli-api" placeholder="http://127.0.0.1:8787/api/v1" /></label>
            <label class="field"><span>Token</span><input id="cli-token" placeholder="可空" type="password" /></label>
            <label class="field"><span>输入时预演载荷</span><input id="cli-preview" type="checkbox" /></label>
            <label class="field"><span>发送键</span><select id="cli-send">
              <option value="button">仅按钮</option>
              <option value="enter">回车发送（Shift+回车换行）</option>
              <option value="shift-enter">Shift+回车发送（回车换行）</option>
            </select></label>
            <label class="field"><span>主题</span><select id="cli-theme">
              <option value="">跟随系统</option>
              <option value="midnight">深夜蓝</option>
              <option value="paper">日间白</option>
              <option value="wine">酒红</option>
              <option value="forest">森绿</option>
              <option value="breeze">Breeze（亮）</option>
              <option value="breeze-dark">Breeze Dark（暗）</option>
            </select></label>
            <div class="row"><button id="cli-save" type="button" class="primary">保存</button><span id="cli-status" class="status"></span></div>
            <p class="hint">API/Token 改完刷新页面生效；预演开关即时生效（localStorage.mc_api / mc_token / mc_preview）。</p>
          </section>
          <section id="panel-agent" class="panel hidden">
            <h3>已有 Agent</h3>
            <div id="agent-list"></div>
            <div class="row">
              <input id="new-agent-name" placeholder="新 agent 名" />
              <button id="agent-add" type="button" class="primary">新建</button>
            </div>
            <div id="agent-detail" class="agent-detail hidden">
              <div id="agent-title" class="detail-title"></div>
              <label class="field-block"><span>系统提示词</span><textarea id="agent-prompt" rows="6" placeholder="system_prompt"></textarea></label>
              <div id="agent-abilities"></div>
              <div class="row">
                <button id="agent-save" type="button" class="primary">保存整段</button>
                <button id="agent-default" type="button">设为默认</button>
                <button id="agent-del" type="button" class="danger">删除</button>
                <span id="agent-status" class="status"></span>
              </div>
            </div>
          </section>
          <section id="panel-provider" class="panel hidden">
            <div id="provider-list"></div>
            <div class="row">
              <input id="new-provider-id" placeholder="新渠道 id" />
              <select id="new-provider-vendor"></select>
              <select id="new-provider-protocol"></select>
              <input id="new-provider-key" placeholder="api_key（可空）" />
              <button id="provider-add" type="button" class="primary">新建</button>
            </div>
            <div id="routes-status" class="status"></div>
          </section>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
